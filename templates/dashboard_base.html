<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/global.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/dashboard_base.css') }}" />

    {% block styles %} {% endblock %}

    <title>{% block title %}Dashboard{% endblock %}</title>
  </head>
  <body>
    <div class="dashboard" id="dashboard">
      <nav>
        <div class="top_ctas">
          <div class="logo_container">
            <img src="{{ url_for('static', filename='assets/images/icct_logo.png') }}" alt="icct_logo" />
          </div>

          <div class="button_container">
            <button type="button" id="sidebar_toggle">
              <img
                src="{{ url_for('static', filename='assets/icons/nav_icon.svg') }}"
                alt="navigation_icon"
              />
            </button>
          </div>
        </div>

        <div class="middle_ctas">
          <a href="{{ url_for('admin_bp.admin_overview') }}">
            <img src="{{ url_for('static', filename='assets/icons/overview_icon.svg') }}" alt="overview_icon" />
            <p>Overview</p>
          </a>

          <a href="{{ url_for('admin_bp.admin_attendance') }}">
            <img src="{{ url_for('static', filename='assets/icons/attendance_icon.svg') }}" alt="attendance_icon" />
            <p>Attendance</p>
          </a>

          <a href="{{ url_for('admin_bp.admin_students') }}">
            <img src="{{ url_for('static', filename='assets/icons/history_icon.svg') }}" alt="history_icon" />
            <p>Students</p>
          </a>
        </div>

        <div class="bottom_ctas">
          <a href="{{ url_for('admin_bp.admin_settings') }}">
            <img src="{{ url_for('static', filename='assets/icons/settings_icon.svg') }}" alt="settings_icon" />
            <p>Account Settings</p>
          </a>

          <a href="{{ url_for('student_bp.index') }}">
            <img src="{{ url_for('static', filename='assets/icons/exit_icon.svg') }}" alt="exit_icon" />
            <p>Return Home</p>
          </a>
        </div>
      </nav>

      <div class="main_content">
        <header>
          <h1>{% block header_title %}Overview{% endblock %}</h1>
          <div class="side_cta_container">
            <a href="#">Welcome, {{ first_name | default('Admin') }}</a>
            <div class="profile_container">
              <img
                src="{{ url_for('static', filename='assets/images/caca.png') }}"
                alt="profile_icon"
              />
            </div>
          </div>
        </header>

        <main>{% block content %} {% endblock %}</main>
      </div>
    </div>

    <script src="{{ url_for('static', filename='scripts/dashboard_base.js') }}"></script>
  </body>
</html>
